# Build APK របស់ ZoeW (Capacitor · Android) ហើយបង្កើត **GitHub Release** ឲ្យទាញយកបានងាយ។
#
# ⛔ APK ត្រូវ sign ដោយ keystore **ដដែលជានិច្ច** ៖ Android បដិសេធការដំឡើង APK ជាន់ App ដែល sign ដោយ keystore
#    ផ្សេង ➜ អ្នកប្រើត្រូវលុប App ចាស់ ➜ បាត់ការចូលប្រព័ន្ធ · PIN · និង **កៅអី License** (Device ID ថ្មី)។
#    ដូច្នេះ ៖ គ្មាន keystore ➜ **មិន build** (⛔ គ្មានការធ្លាក់ចុះទៅ debug key ដែលប្រែរាល់ការរត់)។
#
# Secret ៤ ដែលត្រូវកំណត់ក្នុង Settings ➜ Secrets and variables ➜ Actions (មើល ZoeW/docs/ANDROID.md) ៖
#   · ZOEW_KEYSTORE_BASE64   — ឯកសារ keystore (.jks) ជា base64
#   · ZOEW_KEYSTORE_PASSWORD — ពាក្យសម្ងាត់ keystore
#   · ZOEW_KEY_ALIAS         — ឈ្មោះ key
#   · ZOEW_KEY_PASSWORD      — ពាក្យសម្ងាត់ key
#
# វិញ្ញាបនបត្រ (SHA-256) របស់ keystore នោះ pin ក្នុង ZoeW/android/release-cert.sha256 ➜ secret ដែលចង្អុលទៅ keystore
# ផ្សេង ➜ ជំហានផ្ទៀងផ្ទាត់ធ្លាក់ ➜ គ្មាន Release (APK ដែលទូរស័ព្ទដំឡើងជាន់មិនបាន មិនត្រូវចេញដល់អ្នកប្រើ)។
#
# ពេលរត់ ៖ ចុច «Run workflow» ដោយដៃ · ឬស្វ័យប្រវត្តិពេល `APP_VERSION` ប្រែលើ `main`។
# Release មួយក្នុងមួយកំណែ (`zoew-android-v<APP_VERSION>`) ➜ កំណែដែលមាន Release រួច ➜ មិន build ម្តងទៀត។
#
# APK សាក (មុន merge) ៖ «Run workflow» ➜ ជ្រើស branch ផ្សេងពី `main` ➜ APK sign ដោយ keystore ដដែល (ដំឡើងជាន់ App ចាស់បាន) ចេញជា
# **Pre-release** `zoew-android-v<APP_VERSION>-test.<commit ៧ តួ>` (មួយក្នុងមួយ commit) ➜ មិនប៉ះ Release ផ្លូវការ · push លើ branch មិន build។
# APK សាកតែប៉ុណ្ណោះ build ជាមួយ VITE_PERF_TELEMETRY=1 (ពេលវាស់ស៊ុមពេលបើក/បិទប្រអប់ ➜ Sentry) ⛔ Release ពី main ជានិច្ច 0។

name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ZoeW/src/core/version.ts'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apk:
    name: Build APK ➜ GitHub Release
    if: (vars.ZOE_RUNNER_MODE == 'github' || github.event.repository.private == true) && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ fromJSON(vars.ZOE_RUNNER_MODE == 'github' && '["windows-latest"]' || '["self-hosted","Windows","X64","windows-zoe-android"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: កំណត់ Git Bash របស់ Windows
        shell: powershell
        env:
          ZOE_GIT_BASH_MISSING_MESSAGE: 'រក Git Bash មិនឃើញ៖ {0}។ ដំឡើង Git for Windows និង restart runner service។'
        run: |
          $gitExecutable = (Get-Command git -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path $gitExecutable -Parent) -Parent
          $gitBin = Join-Path $gitRoot 'bin'
          $gitBash = Join-Path $gitBin 'bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw ($env:ZOE_GIT_BASH_MISSING_MESSAGE -f $gitBash)
          }
          & $gitBash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: ពិនិត្យ GitHub CLI
        run: |
          git --version
          gh --version
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: កំណែ និងស្លាក Release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_OUTPUT=$(cygpath -u "$GITHUB_OUTPUT")
          VERSION=$(node -e "const s=require('fs').readFileSync('ZoeW/src/core/version.ts','utf8');const m=s.match(/APP_VERSION\s*=\s*'([0-9]+\.[0-9]+\.[0-9]+)'/);if(!m)process.exit(1);console.log(m[1])")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TEST=false
            TAG="zoew-android-v${VERSION}"
            FILE="ZoeW-${VERSION}.apk"
          else
            TEST=true
            SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
            TAG="zoew-android-v${VERSION}-test.${SHORT}"
            FILE="ZoeW-${VERSION}-test.${SHORT}.apk"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "test=${TEST}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${TAG} មានរួច — មិន build ម្តងទៀត (ឡើង APP_VERSION ដើម្បីបង្កើត Release ថ្មី)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ពិនិត្យ secret របស់ keystore
        id: keystore
        if: steps.meta.outputs.exists == 'false'
        env:
          KS: ${{ secrets.ZOEW_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ZOEW_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ZOEW_KEY_ALIAS }}
          KP: ${{ secrets.ZOEW_KEY_PASSWORD }}
        run: |
          GITHUB_OUTPUT=$(cygpath -u "$GITHUB_OUTPUT")
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          MSG="secret ZOEW_KEYSTORE_BASE64 · ZOEW_KEYSTORE_PASSWORD · ZOEW_KEY_ALIAS · ZOEW_KEY_PASSWORD មិនទាន់គ្រប់ ➜ មិន build (មើល ZoeW/docs/ANDROID.md)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::${MSG}"
            exit 1
          fi
          echo "::warning::${MSG}"

      - uses: actions/setup-java@v6
        if: steps.keystore.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: ដំឡើង Android SDK
        if: steps.keystore.outputs.ready == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: google-services.json (FCM ៖ ជូនដំណឹងលើទូរស័ព្ទ · ស្រេចចិត្ត)
        if: steps.keystore.outputs.ready == 'true'
        env:
          GSJ: ${{ secrets.ZOEW_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::warning::គ្មាន secret ZOEW_GOOGLE_SERVICES_JSON ➜ APK នេះគ្មានការជូនដំណឹងលើទូរស័ព្ទ (App ប្រាប់អ្នកប្រើ)"
            exit 0
          fi
          case "$GSJ" in
            "{"*) printf '%s' "$GSJ" > ZoeW/android/app/google-services.json ;;
            *) printf '%s' "$GSJ" | base64 -d > ZoeW/android/app/google-services.json ;;
          esac
          node -e "const j=require('./ZoeW/android/app/google-services.json'); const ok=(j.client||[]).some((c)=>c&&c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.zoesystem.zoew'); if(!ok){console.error('google-services.json មិនមែនសម្រាប់ com.zoesystem.zoew');process.exit(1)}"

      - name: Build web (--mode android) ➜ cap sync
        if: steps.keystore.outputs.ready == 'true'
        env:
          VITE_PERF_TELEMETRY: ${{ steps.meta.outputs.test == 'true' && '1' || '0' }}
        run: |
          npm ci --prefix ZoeW --prefer-offline --no-audit --no-fund
          npm run android:check --prefix ZoeW
          npm run android:sync --prefix ZoeW

      - name: Build APK (release · sign)
        if: steps.keystore.outputs.ready == 'true'
        env:
          KS: ${{ secrets.ZOEW_KEYSTORE_BASE64 }}
          ZOEW_KEYSTORE_PASSWORD: ${{ secrets.ZOEW_KEYSTORE_PASSWORD }}
          ZOEW_KEY_ALIAS: ${{ secrets.ZOEW_KEY_ALIAS }}
          ZOEW_KEY_PASSWORD: ${{ secrets.ZOEW_KEY_PASSWORD }}
        run: |
          export ZOEW_KEYSTORE_FILE="$(cygpath -m "$RUNNER_TEMP")/zoew-release.jks"
          umask 077
          printf '%s' "$KS" | base64 -d > "$ZOEW_KEYSTORE_FILE"
          cd ZoeW/android
          powershell.exe -NoProfile -Command '& .\gradlew.bat --no-daemon --max-workers=2 "-Dorg.gradle.parallel=false" assembleRelease; exit $LASTEXITCODE'

      - name: ផ្ទៀងផ្ទាត់ហត្ថលេខា ➜ ដាក់ឈ្មោះ
        if: steps.keystore.outputs.ready == 'true'
        run: |
          APK="ZoeW/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::រក APK ដែល sign រួចមិនឃើញ (${APK})"; exit 1; }
          GITHUB_STEP_SUMMARY=$(cygpath -u "$GITHUB_STEP_SUMMARY")
          powershell.exe -NoProfile -Command '& "$env:ANDROID_HOME\build-tools\35.0.0\apksigner.bat" verify -v --print-certs "ZoeW\android\app\build\outputs\apk\release\app-release.apk"; exit $LASTEXITCODE'  > apk-certs.txt || { cat apk-certs.txt; echo "::error::apksigner verify ធ្លាក់ ➜ មិនបង្កើត Release"; exit 1; }
          cat apk-certs.txt
          if ! GOT=$(node ZoeW/scripts/apk-cert-check.mjs apk-certs.txt ZoeW/android/release-cert.sha256 2> apk-cert-why.txt); then
            echo "::error::$(cat apk-cert-why.txt) ➜ secret ចង្អុលទៅ keystore ផ្សេង ឬ APK មិនត្រឹមត្រូវ ➜ មិនបង្កើត Release"
            exit 1
          fi
          echo "$GOT" > apk-cert.txt
          OUT="${{ steps.meta.outputs.file }}"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          {
            echo "### ZoeW ${{ steps.meta.outputs.version }} (Android) — ${{ steps.meta.outputs.tag }}"
            echo ""
            echo "- SHA-256 ៖ \`$(cut -d' ' -f1 "$OUT.sha256")\`"
            echo "- វិញ្ញាបនបត្រ ៖ \`$(cat apk-cert.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: បង្កើត GitHub Release
        if: steps.keystore.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          OUT="${{ steps.meta.outputs.file }}"
          CERT=$(cat apk-cert.txt)
          FLAGS=()
          TITLE="ZoeW ${{ steps.meta.outputs.version }} (Android)"
          : > notes.md
          if [ "${{ steps.meta.outputs.test }}" = "true" ]; then
            FLAGS+=(--prerelease)
            TITLE="ZoeW ${{ steps.meta.outputs.version }} (Android · APK សាក · ${REF_NAME})"
            cat > notes.md <<EOF
          ## ⚠️ APK សាក (មិនទាន់ merge) — មិនមែនកំណែផ្លូវការ

          - branch ៖ \`${REF_NAME}\` · commit \`${GITHUB_SHA}\`
          - សម្រាប់សាកលើទូរស័ព្ទមុន merge តែប៉ុណ្ណោះ ⛔ កុំចែកឲ្យអតិថិជន
          - Release ផ្លូវការនៃកំណែនេះ (ពី main) ដំឡើងជាន់ APK នេះបានផ្ទាល់

          EOF
          fi
          cat >> notes.md <<EOF
          ## ZoeW ${{ steps.meta.outputs.version }} — App Android

          ១. ទាញ **${OUT}** ខាងក្រោម ➜ បើកលើទូរស័ព្ទ Android ➜ អនុញ្ញាត «ដំឡើងពីប្រភពនេះ» ➜ ដំឡើង។
          ២. មាន ZoeW Android រួចហើយ ➜ ដំឡើងជាន់បានផ្ទាល់ (ទិន្នន័យ · PIN · Activation នៅដដែល)។

          ⛔ បើទូរស័ព្ទរាយ «App not installed» ➜ App ចាស់ត្រូវ sign ដោយ keystore ផ្សេង (ឧ. build ពី Android Studio) ➜ មើល ZoeW/docs/ANDROID.md មុនលុប App ចាស់ (កៅអី License)។

          - SHA-256 នៃ APK ៖ \`$(cut -d' ' -f1 "$OUT.sha256")\`
          - វិញ្ញាបនបត្រ sign ៖ \`${CERT}\`
          EOF
          gh release create "${{ steps.meta.outputs.tag }}" "$OUT" "$OUT.sha256" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes-file notes.md \
            "${FLAGS[@]}"

      - name: លុប keystore ចេញពី runner
        if: always()
        run: rm -f "$RUNNER_TEMP/zoew-release.jks"

      - name: លុប config FCM ចេញពី runner
        if: always()
        run: rm -f ZoeW/android/app/google-services.json

      - name: លុប keystore តាមផ្លូវ Windows
        if: always()
        run: rm -f "$(cygpath -u "$RUNNER_TEMP")/zoew-release.jks"
