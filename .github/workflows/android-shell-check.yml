name: Windows APK shell

on:
  pull_request:
    paths:
      - '.github/workflows/android-release.yml'
      - '.github/workflows/android-shell-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: ផ្ទៀង Git Bash និង Windows PowerShell
    if: (vars.ZOE_RUNNER_MODE == 'github' || github.event.repository.private == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.ZOE_RUNNER_MODE == 'github' && '["windows-latest"]' || '["self-hosted","Windows","X64","windows-zoe-android"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: សាក bootstrap ពិត និងករណីកំហុស encoding/path
        shell: powershell
        env:
          ZOE_SHELL_TEST_OK: 'ឆ្លង៖ {0}'
          ZOE_SHELL_TEST_FAIL: 'តេស្ត Windows shell ធ្លាក់៖ {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          function Require-Test($condition, [string]$detail) {
            if (-not $condition) { throw ($env:ZOE_SHELL_TEST_FAIL -f $detail) }
          }
          Require-Test ($PSVersionTable.PSVersion.Major -eq 5) 'expected-Windows-PowerShell-5.1'
          $source = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github\workflows\android-release.yml'), [Text.Encoding]::UTF8)
          $step = [regex]::Match($source, '(?ms)^      - name:[^\r\n]*\r?\n        shell: powershell\r?\n(?<step>.*?)(?=^      - |\z)').Groups['step'].Value
          $body = [regex]::Match($step, '(?ms)^        run: \|\r?\n(?<code>.*)$').Groups['code'].Value
          $script = [regex]::Replace($body, '(?m)^          ', '').TrimEnd() + [Environment]::NewLine
          $message = [regex]::Match($step, "(?m)^          ZOE_GIT_BASH_MISSING_MESSAGE: '(?<message>[^'\r\n]*)'\r?$").Groups['message'].Value
          Require-Test ($script.Contains('Get-Command git') -and $message.Contains('{0}')) 'missing-release-bootstrap'
          Require-Test ($script -notmatch '[^\x00-\x7f]') 'non-ASCII-inline-PowerShell'
          $env:ZOE_GIT_BASH_MISSING_MESSAGE = $message

          $legacyLine = 'throw "' + $message.Replace('{0}', '$gitBash') + '"'
          $legacy = $script.Replace('throw ($env:ZOE_GIT_BASH_MISSING_MESSAGE -f $gitBash)', $legacyLine)
          Require-Test ($legacy -ne $script) 'encoding-mutation-did-not-land'
          $wrongEncoding = [Text.Encoding]::GetEncoding(1252).GetString([Text.Encoding]::UTF8.GetBytes($legacy))
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($wrongEncoding, [ref]$tokens, [ref]$parseErrors) | Out-Null
          Require-Test (@($parseErrors).Count -gt 0) 'legacy-encoding-mutation-survived'
          Write-Host ($env:ZOE_SHELL_TEST_OK -f 'legacy-encoding-negative')

          $testDir = Join-Path $env:RUNNER_TEMP ('zoe-apk-shell-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testDir | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $windowsPowerShell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          try {
            $scriptFile = Join-Path $testDir 'bootstrap.ps1'
            [IO.File]::WriteAllText($scriptFile, $script, $utf8NoBom)
            & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File $scriptFile
            Require-Test ($LASTEXITCODE -eq 0) 'real-Git-Bash-bootstrap'
            Write-Host ($env:ZOE_SHELL_TEST_OK -f 'real-bootstrap-UTF8-without-BOM')

            $missingGit = Join-Path $testDir 'absent-install\cmd\git.exe'
            $missingScript = $script.Replace('(Get-Command git -ErrorAction Stop).Source', ("'" + $missingGit.Replace("'", "''") + "'"))
            Require-Test ($missingScript -ne $script) 'missing-path-mutation-did-not-land'
            $missingFile = Join-Path $testDir 'missing.ps1'
            [IO.File]::WriteAllText($missingFile, $missingScript, $utf8NoBom)
            $ErrorActionPreference = 'Continue'
            $failureOutput = & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File $missingFile 2>&1 | Out-String
            $failureCode = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            Require-Test ($failureCode -ne 0 -and $failureOutput.Contains('absent-install') -and $failureOutput -notmatch 'ParserError') 'missing-Git-Bash-must-fail-with-path'
            Write-Host ($env:ZOE_SHELL_TEST_OK -f 'missing-Git-Bash-negative')
          } finally {
            Remove-Item -LiteralPath $testDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: ផ្ទៀង Git Bash និង CLI ក្នុងជំហានបន្ទាប់
        shell: bash
        run: |
          git --version
          gh --version
          node --version
          cygpath -w /
