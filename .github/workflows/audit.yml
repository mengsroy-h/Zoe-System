# ការត្រួតពិនិត្យស្វ័យប្រវត្តិលើរាល់ PR និង main ៖ `run-all.sh` ពេញ (រួមតេស្ត browser · RTDB emulator ពិត · Postgres ពិត)
# បែងចែកជា ៤ ផ្នែក (`RUNALL_SHARD`) ហើយរត់ស្របគ្នាអតិបរមា ២។ CI បៃតង = ផ្នែកទាំង ៤ បៃតង។
#
# ⛔ ទង់ *_STRICT ធ្វើឲ្យការ SKIP ក្លាយជាការធ្លាក់ — បើ emulator · Postgres · firebase-tools មិនឡើង
#    នោះ CI ត្រូវក្រហម មិនមែនបៃតងក្លែងក្លាយទេ (កំហុស 2.17.2/2.17.3 ship បាន ព្រោះគ្មានអ្វីសាកនឹង rules ពិត)។
name: Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ⛔ runner GitHub (repo ឯកជន) មាន CPU ២ ➜ run-all.sh ពេញមួយ job ចំណាយ ~២៣ នាទី (lane 2 · meta រត់ម្នាក់ឯង) ខណៈ session
  #    (CPU ៤) ~១០ នាទី។ ការកែ ៖ បែងចែកបញ្ជីទៅ job ស្របគ្នា `RUNALL_SHARD=k/N` (`run-all.sh` ៖ LPT តាម RUNALL_HINTS ➜ ផ្នែក
  #    ទាំង N មិនជាន់ · មិនខ្វះ តាមរចនាសម្ព័ន្ធ · runall-runner-test ផ្ទៀង matrix ខាងក្រោម ↔ N)។
  # ⛔ shard នីមួយៗបើក RTDB emulator ផ្ទាល់ ហើយរត់ទង់ STRICT ដូច Runbook ជំហានទី ០ ➜ CI ស្មើការរត់ពេញក្នុង session
  #    (emu/* · money-guardian រត់ពេញ មិនមែន SKIP) ➜ job «Firebase rules» ដាច់លែងត្រូវការ។
  audit-shard:
    name: run-all.sh ផ្នែក ${{ matrix.shard }}/4
    if: github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, wsl-zoe-audit]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # ⛔ `fetch-depth: 0` ចាំបាច់។ លំនាំដើម (`1`) ទាញតែ commit តែមួយ ➜
      # គ្មាន `origin/main` ➜ `version-bump-scope.js` **SKIP រាល់ការរត់**
      # ➜ ការការពារ «កូដ ship ប្រែ ➜ ត្រូវឡើងកំណែ» និង «ការឡើងកំណែទទេ»
      # មិនដែលអនុវត្តលើ PR ណាមួយសោះ។ `VERSIONSCOPE_STRICT=1` ខាងក្រោម
      # ធ្វើឲ្យការបាត់នោះក្លាយជា **ការធ្លាក់** មិនមែនការស្ងាត់ទេ។
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: ដំឡើង dependency
        run: |
          PW_VERSION=$(node -p "require('./ZoeW/package-lock.json').packages['node_modules/playwright-core'].version")
          npm install --no-save --no-audit --no-fund acorn "playwright-core@$PW_VERSION" "playwright@$PW_VERSION"

      - name: ទាញ Chromium
        run: npx --no-install playwright install chromium

      # តេស្ត browser រកមើល Chromium នៅផ្លូវថេរមួយ (ដូចបរិស្ថាន audit ដើម)។
      # ដូច្នេះ symlink វាទៅផ្លូវនោះ ជំនួសការកែឯកសារ ២០។
      - name: ភ្ជាប់ Chromium ទៅផ្លូវដែលតេស្តរំពឹងទុក
        run: |
          set -euo pipefail
          SRC=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")
          if [ ! -x "$SRC" ]; then echo "❌ រក Chromium មិនឃើញ"; exit 1; fi
          echo "chromium: $SRC"
          mkdir -p /opt/pw-browsers/chromium-1194
          ln -sfn "$(dirname "$SRC")" /opt/pw-browsers/chromium-1194/chrome-linux
          test -x /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          # ZoeW React (`ZoeW/scripts/*.mjs` ៖ smoke · sw-check · native-check) ប្រើផ្លូវ `/opt/pw-browsers/chromium`
          ln -sfn /opt/pw-browsers/chromium-1194/chrome-linux/chrome /opt/pw-browsers/chromium
          test -x /opt/pw-browsers/chromium

      - name: ដំឡើង dependency របស់ ZoeW (React ៖ run-all.sh build tree វាស់ពីវា)
        run: npm ci --prefix ZoeW --no-audit --no-fund

      # ⛔ Postgres ពិត + supabase-js ពិតសម្រាប់ supabase-rls · supabase-datastore · supabase-functions · keygen-supabase-admin ·
      #    emu/supabase-* ➜ `SUPABASE_STRICT=1` ខាងក្រោមធ្វើឲ្យ SKIP ក្លាយជា FAIL
      - name: ដំឡើង dependency របស់ supabase (Postgres · pg · supabase-js · typescript)
        run: npm ci --prefix supabase --no-audit --no-fund

      # ⛔ firebase-tools ពិត (កំណែ pin) សម្រាប់ firebase-provision-test ➜ `FBPROVISION_STRICT=1` ខាងក្រោមធ្វើឲ្យ SKIP ក្លាយជា FAIL ·
      #    CLI ដដែលទាញ RTDB emulator ខាងក្រោម (គ្មានការដំឡើង firebase-tools ទី ២)
      - name: ដំឡើង dependency របស់ tools/firebase-provision (firebase-tools)
        run: npm ci --prefix tools/firebase-provision --ignore-scripts --no-audit --no-fund

      - name: ត្រៀម base សម្រាប់ version-bump-scope
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: ទាញ RTDB emulator
        run: tools/firebase-provision/node_modules/.bin/firebase setup:emulators:database

      # ⛔ emulator ត្រូវរស់ **មុន** run-all ➜ emu/* · money-guardian រត់ពេញ (STRICT ៖ ការតភ្ជាប់មិនបាន = FAIL មិនមែន SKIP)
      - name: បើក emulator
        run: |
          set -euo pipefail
          JAR=$(ls "$HOME"/.cache/firebase/emulators/firebase-database-emulator-*.jar | head -1)
          echo "jar: $JAR"
          JAVA_TOOL_OPTIONS="-Xmx512m" nohup java -jar "$JAR" --port 9000 --host 127.0.0.1 > /tmp/emu.log 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/zoe-emulator.pid"
          for i in $(seq 1 60); do
            if curl -sf --noproxy "*" -o /dev/null "http://127.0.0.1:9000/.json?ns=demo-zoe"; then
              echo "emulator UP"
              cp firebase-database.rules.json audit-tools/emu/real.rules.json
              exit 0
            fi
            sleep 1
          done
          echo "❌ emulator មិនឡើងក្នុង ៦០ វិនាទី"
          cat /tmp/emu.log
          exit 1

      # ⛔ ទង់ STRICT ដូច Runbook ជំហានទី ០ (CLAUDE.md) ➜ runall-runner-test ផ្ទៀងថាគ្មានទង់ណាបាត់
      - name: run-all.sh (ផ្នែក ${{ matrix.shard }}/4)
        env:
          RUNALL_JOBS: '2'
          RUNALL_BROWSER_JOBS: '1'
          RUNALL_SHARD: ${{ matrix.shard }}/4
          CRUD_FLOW_STRICT: '1'
          VERSIONSCOPE_STRICT: '1'
          MONEYGUARD_STRICT: '1'
          SUPABASE_STRICT: '1'
          FBPROVISION_STRICT: '1'
        run: bash audit-tools/run-all.sh

      - name: log របស់ emulator ពេលធ្លាក់
        if: failure()
        run: cat /tmp/emu.log || true

      - name: បិទ emulator
        if: always()
        run: |
          PID_FILE="$RUNNER_TEMP/zoe-emulator.pid"
          if [ -f "$PID_FILE" ]; then
            PID=$(cat "$PID_FILE")
            if [[ "$PID" =~ ^[0-9]+$ ]] && [ -r "/proc/$PID/cmdline" ] && \
              tr '\0' ' ' < "/proc/$PID/cmdline" | grep -q 'firebase-database-emulator-'; then
              kill "$PID" 2>/dev/null || true
            fi
            rm -f "$PID_FILE"
          fi
