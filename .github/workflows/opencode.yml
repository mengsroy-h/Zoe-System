name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  opencode:
    if: >-
      (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ')
      || github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode '))
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse pull requests from forks
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          if [ -z "$PR" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.full_name)
          if [ "$head" = "$REPO" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi

      - name: Refuse threads holding text from outside the repository team
        id: thread
        if: steps.trust.outputs.same == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          AUTHOR: ${{ github.event.issue.author_association || github.event.pull_request.author_association }}
          IS_PR: ${{ (github.event.pull_request.number || github.event.issue.pull_request) && 'true' || 'false' }}
        run: |
          list="$RUNNER_TEMP/thread-authors.tsv"
          printf '%s\tUser\n' "$AUTHOR" > "$list"
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[] | [.author_association, .user.type] | @tsv' >> "$list"
          if [ "$IS_PR" = "true" ]; then
            gh api --paginate "repos/$REPO/pulls/$NUMBER/comments" --jq '.[] | [.author_association, .user.type] | @tsv' >> "$list"
            gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq '.[] | [.author_association, .user.type] | @tsv' >> "$list"
          fi
          outside=$(awk -F '\t' '!($1 ~ /^(OWNER|MEMBER|COLLABORATOR)$/ || $2 == "Bot") { n++ } END { print n + 0 }' "$list")
          if [ "$outside" = "0" ]; then echo "trusted=true" >> "$GITHUB_OUTPUT"; else echo "trusted=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout repository
        if: steps.trust.outputs.same == 'true' && steps.thread.outputs.trusted == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        if: steps.trust.outputs.same == 'true' && steps.thread.outputs.trusted == 'true'
        uses: anomalyco/opencode/github@1873fbe304ebeda5051bfd3a54fd091cb277e545
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: big-pickle
          use_github_token: true
