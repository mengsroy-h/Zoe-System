<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <script src="./boot-flags.js"></script>
    <!-- `async` ➜ CDN ខាងក្រៅនេះ **មិនទប់ parser ទេ**។ `sw.js` បោះបង់សំណើឆ្លង origin
         ដោយចេតនា ដូច្នេះ script នេះ **មិនដែលចូល cache** ➜ លើបណ្តាញ «ភ្ជាប់តែស្លាប់»
         វាព្យួរ ហើយ `<body>` មិនទាន់សាងឡើងសោះ។ វាស់បាន៖ ១៨៩ ms ➜ ២០ វិនាទី។
         `error-reporting.js` មានផ្លូវផ្ទុកយឺតរួចហើយ (`sentry-load-race-test.js`)។ -->
    <script async src="https://js.sentry-cdn.com/f03cf063db8e4b61057c43271019892d.min.js" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZoeW - ប្រព័ន្ធគ្រប់គ្រងអីវ៉ាន់</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e31837">
    <meta name="apple-mobile-web-app-title" content="ZoeW">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
    <!-- media="print" ➜ stylesheet ឆ្លង origin នេះ **មិនទប់ការគូរទេ**។ `boot-flags.js`
         ប្តូរវាទៅ `all` ពេល DOM រួចរាល់។ វាស់បាន៖ ពេល fonts.googleapis.com ព្យួរ
         App គូរបាននៅ ១៨៩ ms ជំនួស ២០ វិនាទី (អេក្រង់ស)។ ការប្តូរនេះជា CSP-safe
         (គ្មាន `onload=`) ហើយ `display=swap` ធ្វើឲ្យអក្សរ swap ស្រាប់ហើយ។ -->
    <link id="webFontCss" media="print" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js" crossorigin>

    <script defer src="./vendor/zxing-wasm.js"></script>
    <script src="./firebase-loader.js"></script>
    <script src="./license-verify.js"></script>
    <script src="./error-reporting.js"></script>

    <!-- ⛔ `style.css` ឥឡូវចូលតាម `src/main.tsx` ➜ Vite ដាក់វាជា
         `<link>` ដែលមាន hash ពេល build ➜ cache មិនចាស់ដោយស្ងាត់។ -->
</head>
