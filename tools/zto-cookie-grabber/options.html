<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<title>ZTO Cookie -> ZoeW</title>
<style>
  body { font: 14px system-ui, -apple-system, sans-serif; margin: 24px; max-width: 560px; color: #0f172a; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #475569; margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  button { margin-top: 20px; padding: 10px 20px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #msg { margin-top: 14px; min-height: 20px; font-weight: 600; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
  small { color: #64748b; display: block; margin-top: 6px; }
</style>
</head>
<body>
  <h1>ZTO Cookie -&gt; ZoeW</h1>
  <p class="sub">តម្លៃទាំងនេះរក្សាទុកក្នុង browser របស់អ្នកតែប៉ុណ្ណោះ។</p>

  <label for="endpoint">Endpoint URL</label>
  <input id="endpoint" type="url" placeholder="https://your-site.netlify.app/.netlify/functions/zto-cookie-update">
  <small>ផ្លូវពេញរបស់ Function <code>zto-cookie-update</code>។</small>

  <label for="updateKey">ZTO_COOKIE_UPDATE_KEY</label>
  <input id="updateKey" type="password" autocomplete="off" placeholder="secret">
  <small>តម្លៃដដែលនឹង env var <code>ZTO_COOKIE_UPDATE_KEY</code> ក្នុង Netlify។</small>

  <button id="save">រក្សាទុក</button>
  <div id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
